# ----------------------------------------------------------------------------
# llm-stack - default values
#
# Evaluation baseline. It deliberately fails to start when required TLS or API
# key secrets are absent. Customer-specific production controls are not implied.
# Override per environment in a second values file.
# ----------------------------------------------------------------------------

nameOverride: ""
fullnameOverride: ""

# ----------------------------------------------------------------------------
# Global image pull configuration
# ----------------------------------------------------------------------------
global:
  # Single registry all components pull from. Override to private registry
  # (e.g. acmeacr.azurecr.io/llm-stack) in airgap environments.
  imageRegistry: ""
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  storageClass: ""

# ----------------------------------------------------------------------------
# Common pod security / scheduling defaults
# ----------------------------------------------------------------------------
commonLabels:
  app.kubernetes.io/part-of: llm-stack

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  annotations: {}
  name: ""

# ----------------------------------------------------------------------------
# Inference (vLLM)
# ----------------------------------------------------------------------------
inference:
  enabled: true
  replicaCount: 1

  image:
    repository: vllm/vllm-openai
    tag: "v0.4.3"
    pullPolicy: IfNotPresent

  model:
    # HF model id or local path; override in airgap to a path inside the
    # mirrored model volume.
    name: "meta-llama/Meta-Llama-3.1-8B-Instruct"
    # If model is staged on a PVC, set modelPath. If served from a local
    # directory baked into the image, leave empty.
    modelPath: ""
    # Maximum model context length (tokens) vLLM will allocate KV cache for.
    maxModelLen: 8192
    # Quantization: null, "awq", "gptq", "fp8".
    quantization: null

  args:
    extra:
      - "--trust-remote-code=false"
      - "--disable-log-requests"

  env: []

  auth:
    # vLLM validates the bearer value. The chart does not provide user identity,
    # tenant authorization, quotas, or rate limiting.
    enabled: true
    existingSecret: llm-stack-inference-api-key
    key: api-key

  service:
    type: ClusterIP
    port: 8000

  resources:
    limits:
      nvidia.com/gpu: 1
      memory: "80Gi"
      cpu: "8"
    requests:
      nvidia.com/gpu: 1
      memory: "60Gi"
      cpu: "4"

  nodeSelector:
    workload: llm-inference

  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: "true"
      effect: NoSchedule

  affinity: {}

  probes:
    startupSeconds: 600
    liveness:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 120
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

  autoscaling:
    # Requires a customer-installed external metrics adapter and a validated
    # GPU metric pipeline. Keep disabled in the portable baseline.
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    metricName: DCGM_FI_DEV_GPU_UTIL
    targetAverageValue: 70

  pdb:
    # A PDB with one replica blocks voluntary disruption without adding
    # availability. Enable only in a customer overlay with multiple replicas.
    enabled: false
    minAvailable: 1

  modelVolume:
    enabled: false
    claimName: "llm-model-cache"

# ----------------------------------------------------------------------------
# Vector DB (Qdrant)
# ----------------------------------------------------------------------------
vectorDb:
  enabled: true
  engine: qdrant

  image:
    repository: qdrant/qdrant
    tag: "v1.9.2"
    pullPolicy: IfNotPresent

  # This chart does not configure Qdrant distributed consensus. Keep one replica
  # until a customer-specific clustered Qdrant design is supplied and tested.
  replicaCount: 1

  service:
    type: ClusterIP
    httpPort: 6333
    grpcPort: 6334

  persistence:
    enabled: true
    size: 200Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce

  resources:
    limits:
      memory: "8Gi"
      cpu: "4"
    requests:
      memory: "4Gi"
      cpu: "2"

  config:
    logLevel: INFO
    telemetryDisabled: true

# ----------------------------------------------------------------------------
# Gateway (Traefik reverse proxy)
# ----------------------------------------------------------------------------
gateway:
  enabled: true

  traefik:
    image:
      repository: traefik
      tag: "v3.0.3"
      pullPolicy: IfNotPresent

    replicaCount: 2

    service:
      type: LoadBalancer
      # Expose internally only; override annotations for cloud-specific
      # internal load balancers.
      annotations:
        service.beta.kubernetes.io/azure-load-balancer-internal: "true"
        service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"
        networking.gke.io/load-balancer-type: "Internal"
      httpPort: 80
      httpsPort: 443

    resources:
      limits:
        memory: "512Mi"
        cpu: "500m"
      requests:
        memory: "256Mi"
        cpu: "200m"

  tls:
    enabled: true
    secretName: llm-stack-tls

  ingress:
    # Optional integration with a customer-installed ingress controller. The
    # default internal LoadBalancer service can be used without this object.
    enabled: false
    className: traefik
    hostname: llm.internal.example.com
    tls:
      enabled: true
      secretName: llm-stack-tls

# ----------------------------------------------------------------------------
# Observability (OpenTelemetry Collector)
# ----------------------------------------------------------------------------
observability:
  otelCollector:
    enabled: true
    image:
      repository: otel/opentelemetry-collector-contrib
      tag: "0.100.0"
      pullPolicy: IfNotPresent

    # Destinations. Override in values-airgap.yaml for customer-internal
    # Loki / Prometheus / Tempo endpoints.
    exporters:
      prometheus:
        endpoint: "prometheus-server.monitoring.svc.cluster.local:9090"
      loki:
        endpoint: "http://loki-gateway.monitoring.svc.cluster.local:80/loki/api/v1/push"
      otlp:
        endpoint: "tempo.monitoring.svc.cluster.local:4317"
        insecure: true

    resources:
      limits:
        memory: "512Mi"
        cpu: "500m"
      requests:
        memory: "256Mi"
        cpu: "200m"

  serviceMonitor:
    enabled: false
    interval: 30s
    labels:
      release: prometheus

# ----------------------------------------------------------------------------
# Secrets (External Secrets Operator)
# ----------------------------------------------------------------------------
externalSecrets:
  # Disabled in the baseline because the ESO CRD and store are customer
  # resources. values-airgap.yaml enables the integration explicitly.
  enabled: false
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore

  refreshInterval: 1h

  secrets:
    - name: llm-stack-inference-api-key
      data:
        - secretKey: api-key
          remoteRef:
            key: llm-stack/inference-api-key

# ----------------------------------------------------------------------------
# Network policy (default-deny)
# ----------------------------------------------------------------------------
networkPolicy:
  # The baseline may need model-registry egress. Airgap values enable the
  # default-deny policy only after images and model weights are staged.
  enabled: false
  # Additional namespaces that are allowed to call the gateway (e.g. the
  # customer's reverse proxy or API gateway namespace).
  allowedIngressNamespaces:
    - monitoring
  # Add customer-controlled source CIDRs when an internal load balancer reaches
  # gateway pods directly rather than through an ingress-controller namespace.
  allowedIngressCidrs: []

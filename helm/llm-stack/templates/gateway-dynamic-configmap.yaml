{{- if .Values.gateway.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llm-stack.fullname" . }}-gateway-dynamic
  labels:
    {{- include "llm-stack.componentLabels" (dict "component" "gateway" "Values" .Values "Chart" .Chart "Release" .Release) | nindent 4 }}
data:
  dynamic.yaml: |
    http:
      routers:
        inference-http:
          entryPoints:
            - web
          rule: PathPrefix(`/`)
          service: inference
        {{- if .Values.gateway.tls.enabled }}
        inference-https:
          entryPoints:
            - websecure
          rule: PathPrefix(`/`)
          service: inference
          tls: {}
        {{- end }}
      services:
        inference:
          loadBalancer:
            passHostHeader: true
            servers:
              - url: http://{{ include "llm-stack.fullname" . }}-inference:{{ .Values.inference.service.port }}
    {{- if .Values.gateway.tls.enabled }}
    tls:
      certificates:
        - certFile: /etc/traefik/tls/tls.crt
          keyFile: /etc/traefik/tls/tls.key
    {{- end }}
{{- end }}

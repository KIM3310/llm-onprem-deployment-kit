version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "deps"
      include: "scope"
  # Keep shared provider constraints aligned across root examples, modules, and
  # module examples. Updating these directories independently creates an
  # unsatisfiable combination while a pull request is under validation.
  - package-ecosystem: "terraform"
    directories:
      - "/terraform/examples/airgapped-enterprise"
      - "/terraform/examples/dev-sandbox"
      - "/terraform/modules/aws-eks"
      - "/terraform/modules/aws-eks/examples/basic"
      - "/terraform/modules/azure-aks"
      - "/terraform/modules/azure-aks/examples/basic"
      - "/terraform/modules/gcp-gke"
      - "/terraform/modules/gcp-gke/examples/basic"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    groups:
      terraform-dependencies:
        group-by: dependency-name
        patterns:
          - "*"
    ignore:
      # AzureRM 4.x/5.x requires an explicit module migration; automated
      # requirement-only bumps currently fail validation across four roots.
      - dependency-name: "hashicorp/azurerm"
        versions:
          - ">= 4.0.0"
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "deps"
      include: "scope"
